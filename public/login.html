<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Đăng nhập hoặc tạo tài khoản TechFix để đặt lịch và theo dõi tiến độ sửa chữa."
    />
    <title>Đăng nhập hoặc tạo tài khoản | TechFix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css?v=20261109" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tf-theme");
          if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
            t = "dark";
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
        document.documentElement.classList.add("js");
      })();
    </script>
    <script src="../js/motion.js" defer></script>
  </head>
  <body>
    <div class="topbar">
      <div class="wrap">
        <div class="hotline">Hotline: <span>1900 6363</span></div>
        <div class="topbar-links">
          <a href="contact.html">12 cửa hàng tại TP.HCM</a>
        </div>
      </div>
    </div>

    <header class="site-header">
      <div class="wrap">
        <a class="logo" href="index.html">
          <img src="../assets/logo.png" alt="" class="logo-icon" />
        </a>
        <nav class="main-nav">
          <a href="index.html">Trang chủ</a><a href="booking.html">Đặt lịch</a
          ><a href="contact.html">Liên hệ</a>
        </nav>
      </div>
    </header>

    <div class="auth-shell">
      <div class="auth-card">
        <div class="auth-tabs" id="auth-tabs-bar">
          <button
            type="button"
            id="tab-login"
            class="active"
            onclick="switchTab('login')"
          >
            Đăng nhập
          </button>
          <button
            type="button"
            id="tab-register"
            onclick="switchTab('register')"
          >
            Đăng ký
          </button>
        </div>

        <div class="form-card">
          <!-- Notification message container (e.g. activation, reset, etc.) -->
          <div
            id="auth-alert"
            style="
              display: none;
              padding: 12px 14px;
              border-radius: 10px;
              margin-bottom: 16px;
              font-size: 0.88rem;
              line-height: 1.45;
            "
          ></div>

          <!-- Panel: Login -->
          <div id="panel-login" class="auth-panel active">
            <form id="login-form">
              <div class="field">
                <label for="l-phone">Số điện thoại</label>
                <input
                  type="tel"
                  id="l-phone"
                  placeholder="09xx xxx xxx"
                  required
                />
              </div>
              <div class="field">
                <label for="l-pass">Mật khẩu</label>
                <input
                  type="password"
                  id="l-pass"
                  placeholder="••••••••"
                  required
                />
              </div>
              <div
                style="
                  display: flex;
                  justify-content: space-between;
                  align-items: center;
                  margin-bottom: 18px;
                  font-size: 0.85rem;
                "
              >
                <label
                  style="
                    display: flex;
                    align-items: center;
                    gap: 6px;
                    font-weight: 400;
                  "
                >
                  <input type="checkbox" style="width: auto" /> Ghi nhớ đăng nhập
                </label>
                <a
                  href="#"
                  id="link-forgot-pass"
                  style="color: var(--primary); font-weight: 600"
                >
                  Quên mật khẩu?
                </a>
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                Đăng nhập
              </button>
            </form>
          </div>

          <!-- Panel: Register -->
          <div id="panel-register" class="auth-panel">
            <form id="register-form">
              <div class="field">
                <label for="r-name">Họ và tên</label>
                <input
                  type="text"
                  id="r-name"
                  placeholder="Nguyễn Văn A"
                  required
                />
              </div>
              <div class="field">
                <label for="r-phone">Số điện thoại</label>
                <input
                  type="tel"
                  id="r-phone"
                  placeholder="09xx xxx xxx"
                  required
                />
              </div>
              <div class="field">
                <label for="r-email">Địa chỉ Email</label>
                <input
                  type="email"
                  id="r-email"
                  placeholder="name@example.com"
                  required
                />
              </div>
              <div class="field">
                <label for="r-pass">Mật khẩu</label>
                <input
                  type="password"
                  id="r-pass"
                  placeholder="Tối thiểu 8 ký tự"
                  required
                />
              </div>
              <div class="field">
                <label for="r-pass2">Nhập lại mật khẩu</label>
                <input type="password" id="r-pass2" required />
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                Tạo tài khoản
              </button>
            </form>
          </div>

          <!-- Panel: Forgot Password -->
          <div id="panel-forgot" class="auth-panel" style="display: none">
            <form id="forgot-form">
              <h3 style="margin-top: 0; font-size: 1.15rem; font-weight: 700">
                Khôi phục mật khẩu
              </h3>
              <p
                style="
                  font-size: 0.88rem;
                  color: var(--ink-soft);
                  margin-top: 4px;
                  margin-bottom: 16px;
                  line-height: 1.5;
                "
              >
                Nhập địa chỉ email đăng ký tài khoản của bạn. TechFix sẽ gửi liên
                kết để bạn đặt lại mật khẩu mới.
              </p>
              <div class="field">
                <label for="f-email">Email tài khoản</label>
                <input
                  type="email"
                  id="f-email"
                  placeholder="name@example.com"
                  required
                />
              </div>
              <button type="submit" class="btn btn-primary btn-block">
                Gửi liên kết đặt lại mật khẩu
              </button>
              <div style="text-align: center; margin-top: 14px">
                <a
                  href="#"
                  id="link-back-login"
                  style="
                    font-size: 0.85rem;
                    color: var(--ink-soft);
                    font-weight: 600;
                  "
                >
                  ← Quay lại đăng nhập
                </a>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <div class="float-contact">
      <a
        href="tel:19006363"
        class="float-btn call"
        title="Gọi hotline 1900 6363"
        aria-label="Gọi hotline 1900 6363"
      >
        <img src="../assets/icon_call.png?v=20261109" alt="Gọi hotline" />
      </a>
      <a
        href="#"
        class="float-btn zalo"
        title="Nhắn tin qua Zalo"
        aria-label="Nhắn tin qua Zalo"
      >
        <img src="../assets/icon_zalo.png?v=20261109" alt="Zalo" />
      </a>
      <a
        href="#"
        class="float-btn msg"
        title="Nhắn Messenger"
        aria-label="Nhắn Messenger"
      >
        <img src="../assets/icon_msg.png?v=20261109" alt="Messenger" />
      </a>
    </div>

    <script>
      function showAlert(msg, isSuccess) {
        var el = document.getElementById("auth-alert");
        if (!el) return;
        el.style.display = "block";
        el.textContent = msg;
        if (isSuccess) {
          el.style.background = "color-mix(in srgb, var(--ok, #3f7a4f) 15%, var(--surface))";
          el.style.border = "1px solid var(--ok, #3f7a4f)";
          el.style.color = "var(--ok, #3f7a4f)";
        } else {
          el.style.background = "color-mix(in srgb, var(--error, #a63a2b) 15%, var(--surface))";
          el.style.border = "1px solid var(--error, #a63a2b)";
          el.style.color = "var(--error, #a63a2b)";
        }
      }

      function switchTab(name) {
        var tabsBar = document.getElementById("auth-tabs-bar");
        var panelLogin = document.getElementById("panel-login");
        var panelRegister = document.getElementById("panel-register");
        var panelForgot = document.getElementById("panel-forgot");

        if (name === "forgot") {
          tabsBar.style.display = "none";
          panelLogin.style.display = "none";
          panelLogin.classList.remove("active");
          panelRegister.style.display = "none";
          panelRegister.classList.remove("active");
          panelForgot.style.display = "block";
          panelForgot.classList.add("active");
          return;
        }

        tabsBar.style.display = "flex";
        panelForgot.style.display = "none";
        panelForgot.classList.remove("active");

        panelLogin.style.display = "";
        panelRegister.style.display = "";

        document
          .getElementById("tab-login")
          .classList.toggle("active", name === "login");
        document
          .getElementById("tab-register")
          .classList.toggle("active", name === "register");
        panelLogin.classList.toggle("active", name === "login");
        panelRegister.classList.toggle("active", name === "register");
      }

      document
        .getElementById("link-forgot-pass")
        .addEventListener("click", function (e) {
          e.preventDefault();
          switchTab("forgot");
        });

      document
        .getElementById("link-back-login")
        .addEventListener("click", function (e) {
          e.preventDefault();
          switchTab("login");
        });

      function setFormLoading(form, loading) {
        var btn = form.querySelector('button[type="submit"]');
        if (!btn) return;
        if (loading) {
          btn.dataset.originalText = btn.textContent;
          btn.textContent = "Đang xử lý...";
          btn.disabled = true;
        } else {
          btn.textContent = btn.dataset.originalText || btn.textContent;
          btn.disabled = false;
        }
      }

      function tryExtractJson(raw) {
        try {
          return JSON.parse(raw);
        } catch (e) {
          var start = raw.indexOf("{");
          var end = raw.lastIndexOf("}");
          if (start !== -1 && end !== -1 && end > start) {
            try {
              return JSON.parse(raw.slice(start, end + 1));
            } catch (e2) {
              return null;
            }
          }
          return null;
        }
      }

      function safeNextPage() {
        var next = new URLSearchParams(window.location.search).get("next");
        return next && /^[a-z0-9_-]+\.html(\?[^#\s]*)?$/i.test(next)
          ? next
          : null;
      }

      async function submitAuthForm(form, url, fields) {
        var formData = new FormData();
        Object.keys(fields).forEach(function (key) {
          formData.append(key, document.getElementById(fields[key]).value);
        });

        setFormLoading(form, true);
        try {
          var res = await fetch(url, { method: "POST", body: formData });
          var raw = await res.text();
          var result = tryExtractJson(raw);

          if (!result) {
            console.error("Response không parse được:", raw);
            alert("Có lỗi xảy ra, vui lòng thử lại sau.");
            return;
          }

          if (result.success) {
            var role = result.data && result.data.role;
            if (role === "admin" || role === "technician") {
              window.location.href = "admin.html";
            } else {
              window.location.href = safeNextPage() || "dashboard.html";
            }
          } else {
            alert(result.message || "Thao tác thất bại, vui lòng thử lại.");
          }
        } catch (networkErr) {
          console.error(networkErr);
          alert(
            "Không kết nối được tới máy chủ. Kiểm tra lại XAMPP đã bật chưa.",
          );
        } finally {
          setFormLoading(form, false);
        }
      }

      document
        .getElementById("login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          submitAuthForm(e.target, "../api/login.php", {
            phone: "l-phone",
            password: "l-pass",
          });
        });

      document
        .getElementById("register-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          submitAuthForm(e.target, "../api/register.php", {
            full_name: "r-name",
            phone: "r-phone",
            email: "r-email",
            password: "r-pass",
            password2: "r-pass2",
          });
        });

      document
        .getElementById("forgot-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          var form = e.target;
          var emailVal = document.getElementById("f-email").value;
          var formData = new FormData();
          formData.append("email", emailVal);

          setFormLoading(form, true);
          try {
            var res = await fetch("../api/forgot_password.php", {
              method: "POST",
              body: formData,
            });
            var raw = await res.text();
            var result = tryExtractJson(raw);
            if (result && result.success) {
              showAlert(result.message, true);
              form.reset();
            } else {
              showAlert(
                (result && result.message) || "Không thể gửi yêu cầu.",
                false,
              );
            }
          } catch (err) {
            showAlert("Không kết nối được tới máy chủ.", false);
          } finally {
            setFormLoading(form, false);
          }
        });

      // Check query parameters on page load
      (function checkUrlNotice() {
        var params = new URLSearchParams(window.location.search);
        if (params.get("activated") === "1") {
          showAlert(
            "🎉 Tài khoản của bạn đã được kích hoạt thành công! Hãy đăng nhập để bắt đầu trải nghiệm.",
            true,
          );
        } else if (params.get("reset") === "1") {
          showAlert(
            "✅ Mật khẩu đã được đặt lại thành công! Vui lòng đăng nhập với mật khẩu mới.",
            true,
          );
        } else if (params.get("activation_error")) {
          var err = params.get("activation_error");
          var msg =
            err === "invalid"
              ? "Liên kết kích hoạt không hợp lệ hoặc tài khoản đã được kích hoạt từ trước."
              : "Có lỗi khi kích hoạt tài khoản. Vui lòng thử lại.";
          showAlert(msg, false);
        }
      })();
    </script>
  </body>
</html>
