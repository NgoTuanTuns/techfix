<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Đặt lại mật khẩu mới cho tài khoản của bạn tại TechFix."
    />
    <title>Đặt lại mật khẩu | TechFix</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..700,0..100;1,9..144,400..700,0..100&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("tf-theme");
          if (!t && window.matchMedia("(prefers-color-scheme: dark)").matches)
            t = "dark";
          if (t) document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
        document.documentElement.classList.add("js");
      })();
    </script>
    <script src="../js/motion.js" defer></script>
  </head>
  <body>
    <div class="topbar">
      <div class="wrap">
        <div class="hotline">Hotline: <span>1900 6363</span></div>
        <div class="topbar-links">
          <a href="contact.html">12 cửa hàng tại TP.HCM</a>
        </div>
      </div>
    </div>

    <header class="site-header">
      <div class="wrap">
        <a class="logo" href="index.html">
          <img src="../assets/logo.png" alt="" class="logo-icon" />
        </a>
        <nav class="main-nav">
          <a href="index.html">Trang chủ</a>
          <a href="booking.html">Đặt lịch</a>
          <a href="contact.html">Liên hệ</a>
        </nav>
      </div>
    </header>

    <div class="auth-shell">
      <div class="auth-card">
        <div class="form-card">
          <h2 style="margin-top: 0; font-size: 1.35rem; font-weight: 700">
            Đặt lại mật khẩu mới
          </h2>
          <p
            style="
              font-size: 0.88rem;
              color: var(--ink-soft);
              margin-top: 4px;
              margin-bottom: 20px;
              line-height: 1.5;
            "
          >
            Vui lòng nhập mật khẩu mới cho tài khoản của bạn (tối thiểu 8 ký tự).
          </p>

          <div
            id="reset-alert"
            style="
              display: none;
              padding: 12px 14px;
              border-radius: 10px;
              margin-bottom: 16px;
              font-size: 0.88rem;
              line-height: 1.45;
            "
          ></div>

          <form id="reset-form">
            <input type="hidden" id="reset-token" />
            <div class="field">
              <label for="new-pass">Mật khẩu mới</label>
              <input
                type="password"
                id="new-pass"
                placeholder="Tối thiểu 8 ký tự"
                required
              />
            </div>
            <div class="field">
              <label for="new-pass2">Nhập lại mật khẩu mới</label>
              <input
                type="password"
                id="new-pass2"
                placeholder="Nhập lại mật khẩu mới"
                required
              />
            </div>
            <button type="submit" class="btn btn-primary btn-block">
              Lưu mật khẩu mới
            </button>
            <div style="text-align: center; margin-top: 14px">
              <a
                href="login.html"
                style="
                  font-size: 0.85rem;
                  color: var(--ink-soft);
                  font-weight: 600;
                "
              >
                ← Quay lại trang đăng nhập
              </a>
            </div>
          </form>
        </div>
      </div>
    </div>

    <div class="float-contact">
      <a
        href="tel:19006363"
        class="float-btn call"
        title="Gọi hotline 1900 6363"
        >☎</a
      >
      <a href="#" class="float-btn zalo" title="Nhắn tin qua Zalo">Zalo</a>
    </div>

    <script>
      function showAlert(msg, isSuccess) {
        var el = document.getElementById("reset-alert");
        if (!el) return;
        el.style.display = "block";
        el.textContent = msg;
        if (isSuccess) {
          el.style.background = "color-mix(in srgb, var(--ok, #3f7a4f) 15%, var(--surface))";
          el.style.border = "1px solid var(--ok, #3f7a4f)";
          el.style.color = "var(--ok, #3f7a4f)";
        } else {
          el.style.background = "color-mix(in srgb, var(--error, #a63a2b) 15%, var(--surface))";
          el.style.border = "1px solid var(--error, #a63a2b)";
          el.style.color = "var(--error, #a63a2b)";
        }
      }

      function setFormLoading(form, loading) {
        var btn = form.querySelector('button[type="submit"]');
        if (!btn) return;
        if (loading) {
          btn.dataset.originalText = btn.textContent;
          btn.textContent = "Đang lưu...";
          btn.disabled = true;
        } else {
          btn.textContent = btn.dataset.originalText || btn.textContent;
          btn.disabled = false;
        }
      }

      function tryExtractJson(raw) {
        try {
          return JSON.parse(raw);
        } catch (e) {
          var start = raw.indexOf("{");
          var end = raw.lastIndexOf("}");
          if (start !== -1 && end !== -1 && end > start) {
            try {
              return JSON.parse(raw.slice(start, end + 1));
            } catch (e2) {
              return null;
            }
          }
          return null;
        }
      }

      (function checkToken() {
        var token = new URLSearchParams(window.location.search).get("token");
        if (!token) {
          showAlert(
            "Liên kết đặt lại mật khẩu không hợp lệ hoặc thiếu mã xác thực.",
            false,
          );
          document.getElementById("reset-form").style.display = "none";
          return;
        }
        document.getElementById("reset-token").value = token;
      })();

      document
        .getElementById("reset-form")
        .addEventListener("submit", async function (e) {
          e.preventDefault();
          var form = e.target;
          var token = document.getElementById("reset-token").value;
          var pass = document.getElementById("new-pass").value;
          var pass2 = document.getElementById("new-pass2").value;

          if (pass.length < 8) {
            showAlert("Mật khẩu mới phải có ít nhất 8 ký tự.", false);
            return;
          }
          if (pass !== pass2) {
            showAlert("Mật khẩu nhập lại không khớp.", false);
            return;
          }

          var formData = new FormData();
          formData.append("token", token);
          formData.append("password", pass);
          formData.append("password2", pass2);

          setFormLoading(form, true);
          try {
            var res = await fetch("../api/reset_password.php", {
              method: "POST",
              body: formData,
            });
            var raw = await res.text();
            var result = tryExtractJson(raw);

            if (result && result.success) {
              window.location.href = "login.html?reset=1";
            } else {
              showAlert(
                (result && result.message) ||
                  "Không thể đặt lại mật khẩu. Vui lòng thử lại sau.",
                false,
              );
            }
          } catch (err) {
            showAlert(
              "Không kết nối được tới máy chủ. Kiểm tra lại kết nối mạng.",
              false,
            );
          } finally {
            setFormLoading(form, false);
          }
        });
    </script>
  </body>
</html>
