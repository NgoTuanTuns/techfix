<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <title>Sửa chữa Laptop</title>
  <defs>
    <linearGradient id="lp-lid" x1="28" y1="18" x2="132" y2="86" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33415f"/>
      <stop offset="1" stop-color="#152238"/>
    </linearGradient>
    <linearGradient id="lp-scr" x1="34" y1="22" x2="126" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e3a5f"/>
      <stop offset="0.55" stop-color="#162844"/>
      <stop offset="1" stop-color="#0f1c30"/>
    </linearGradient>
    <linearGradient id="lp-base" x1="16" y1="84" x2="144" y2="98" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f5f4ec"/>
      <stop offset="0.5" stop-color="#dcded8"/>
      <stop offset="1" stop-color="#aeb6c2"/>
    </linearGradient>
    <linearGradient id="lp-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a35e"/>
      <stop offset="1" stop-color="#c2540f"/>
    </linearGradient>
    <linearGradient id="lp-ok" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a9c1ab"/>
      <stop offset="1" stop-color="#4e7a5d"/>
    </linearGradient>
    <filter id="lp-sh" x="4" y="10" width="152" height="106" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0a1224" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Bóng đổ dưới chân máy -->
  <ellipse cx="80" cy="101" rx="62" ry="6" fill="#0a1224" opacity="0.28"/>

  <g filter="url(#lp-sh)">
    <!-- Khung màn hình kim loại -->
    <rect x="28" y="18" width="104" height="68" rx="7" fill="url(#lp-lid)" stroke="#e5e7eb" stroke-width="1.4"/>
    <!-- Tấm nền màn hình -->
    <rect x="33" y="23" width="94" height="57" rx="4" fill="url(#lp-scr)"/>
    <!-- Cụm camera / notch -->
    <path d="M72 23h16l-1.5 3.2a2 2 0 0 1-1.8 1.1h-9.4a2 2 0 0 1-1.8-1.1L72 23Z" fill="#0b1322"/>
    <circle cx="80" cy="24.8" r="1" fill="#4f86c6"/>

    <!-- Phản광 mặt kính -->
    <path d="M35 25h42l-26 53H35V25Z" fill="#ffffff" opacity="0.06"/>

    <!-- Giao diện chẩn đoán trên màn hình -->
    <rect x="40" y="31" width="46" height="28" rx="3.5" fill="#1f3456" stroke="#3b5984" stroke-width="1"/>
    <circle cx="45" cy="35.5" r="1.3" fill="#f07167"/>
    <circle cx="49.5" cy="35.5" r="1.3" fill="#fff4b8"/>
    <circle cx="54" cy="35.5" r="1.3" fill="#7ec89b"/>
    <path d="M44 43h22M44 48h32M44 53h16" stroke="#a9c1ab" stroke-width="2" stroke-linecap="round"/>

    <!-- Vòng đo hiệu năng / nhiệt độ -->
    <rect x="91" y="31" width="29" height="28" rx="3.5" fill="#1f3456" stroke="#3b5984" stroke-width="1"/>
    <circle cx="105.5" cy="45" r="8.5" stroke="#2d4970" stroke-width="2.6"/>
    <path d="M105.5 36.5a8.5 8.5 0 1 1-6.8 3.4" stroke="url(#lp-acc)" stroke-width="2.6" stroke-linecap="round"/>
    <path d="M103 45.2l2 2 4-4" stroke="#fff4b8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Thanh trạng thái dưới màn hình -->
    <rect x="40" y="64" width="80" height="9" rx="2.5" fill="#233b61"/>
    <rect x="42" y="66.5" width="48" height="4" rx="2" fill="url(#lp-ok)"/>
    <circle cx="114" cy="68.5" r="2" fill="#f0a35e"/>

    <!-- Bản lề -->
    <rect x="60" y="84" width="40" height="2.5" rx="1" fill="#1e293b"/>

    <!-- Thân đế bàn phím unibody -->
    <path d="M16 86.5h128v4.5c0 3.3-3.2 6-7.2 6H23.2c-4 0-7.2-2.7-7.2-6v-4.5Z" fill="url(#lp-base)" stroke="#1b2b4b" stroke-width="1.4"/>
    <!-- Rãnh mở máy (trackpad notch) -->
    <path d="M68 86.5h24l-1.5 2.8a2 2 0 0 1-1.8 1H71.3a2 2 0 0 1-1.8-1L68 86.5Z" fill="#8b95a5"/>
    <!-- Khe tản nhiệt cạnh bên -->
    <path d="M26 91.5h10M124 91.5h10" stroke="#64748b" stroke-width="1.4" stroke-linecap="round"/>

    <!-- Huy hiệu cờ lê sửa chữa góc phải dưới -->
    <circle cx="127" cy="76" r="15" fill="url(#lp-acc)" stroke="#fafaf3" stroke-width="2"/>
    <path d="M123.5 72.5a4.8 4.8 0 0 1 6.2 6.2l3.6 3.6a1.6 1.6 0 0 1-2.3 2.3l-3.6-3.6a4.8 4.8 0 0 1-6.2-6.2l2.5 2.5 2.2-.6.6-2.2-3-2Z" fill="#ffffff"/>
  </g>
</svg>
