<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <filter id="pwShadow" x="20" y="6" width="200" height="150" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="waterDrop" x1="50" y1="30" x2="74" y2="78" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="shieldDry" x1="142" y1="76" x2="188" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="1" stop-color="#ea580c"/>
    </linearGradient>
  </defs>

  <g filter="url(#pwShadow)">
    <!-- Smartphone Body -->
    <rect x="76" y="12" width="84" height="136" rx="15" fill="#1e293b" stroke="#64748b" stroke-width="2.2"/>
    <rect x="82" y="18" width="72" height="124" rx="11" fill="#0f172a"/>

    <!-- Ultrasonic Cleaning Wave Rings Inside Screen -->
    <circle cx="118" cy="76" r="26" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4 4"/>
    <circle cx="118" cy="76" r="16" fill="#0284c7" fill-opacity="0.25" stroke="#7dd3fc" stroke-width="2"/>
    <path d="M111 76L116 81L126 71" stroke="#38bdf8" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Water Splash / Droplets Being Repelled (Left Side) -->
    <path d="M58 34C58 34 72 52 72 62C72 69.732 65.732 76 58 76C50.268 76 44 69.732 44 62C44 52 58 34 58 34Z" fill="url(#waterDrop)" stroke="#bae6fd" stroke-width="1.5"/>
    <path d="M53 60C53 64 55 67 58 68" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>

    <!-- Small Water Droplet -->
    <path d="M46 92C46 92 54 102 54 108C54 112.418 50.418 116 46 116C41.582 116 38 112.418 38 108C38 102 46 92 46 92Z" fill="url(#waterDrop)" stroke="#bae6fd" stroke-width="1.2"/>

    <!-- Ultrasonic Drying & Anti-Corrosion Shield (Right Side) -->
    <path d="M166 74L190 84V104C190 120 179 131 166 136C153 131 142 120 142 104V84L166 74Z" fill="url(#shieldDry)" stroke="#ffffff" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Warm Dry Air / Sun Icon inside Shield -->
    <circle cx="166" cy="104" r="8" fill="#fef08a"/>
    <path d="M166 90V93M166 115V118M152 104H155M177 104H180" stroke="#fef08a" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
