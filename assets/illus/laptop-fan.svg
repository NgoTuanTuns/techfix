<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <defs>
    <filter id="fanShadow" x="10" y="10" width="300" height="225" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.28"/>
    </filter>
    <linearGradient id="pcbBoard" x1="40" y1="24" x2="280" y2="206" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="copperPipe" x1="60" y1="50" x2="260" y2="140" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.45" stop-color="#ea580c"/>
      <stop offset="0.8" stop-color="#9a3412"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="fanShroud" x1="150" y1="50" x2="265" y2="175" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#475569"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="airStream" x1="250" y1="60" x2="305" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g filter="url(#fanShadow)">
    <!-- Laptop Chassis Base -->
    <rect x="34" y="22" width="252" height="186" rx="18" fill="#334155" stroke="#64748b" stroke-width="2"/>
    <!-- Internal Motherboard PCB -->
    <rect x="44" y="32" width="232" height="166" rx="12" fill="url(#pcbBoard)" stroke="#475569" stroke-width="1.5"/>

    <!-- PCB Circuit Traces -->
    <path d="M56 64H88L102 78V116" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M56 142H92L112 162H154" stroke="#334155" stroke-width="2" stroke-linecap="round"/>
    <path d="M120 44V68L138 86" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <!-- RAM & VRM Modules -->
    <rect x="56" y="46" width="46" height="22" rx="3" fill="#065f46" stroke="#10b981" stroke-width="1.2"/>
    <rect x="62" y="51" width="8" height="12" rx="1" fill="#0f172a"/>
    <rect x="74" y="51" width="8" height="12" rx="1" fill="#0f172a"/>
    <rect x="86" y="51" width="8" height="12" rx="1" fill="#0f172a"/>

    <!-- Heatsink Fin Array (Top Right) -->
    <rect x="184" y="34" width="76" height="18" rx="3" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1"/>
    <path d="M192 34V52M200 34V52M208 34V52M216 34V52M224 34V52M232 34V52M240 34V52M248 34V52" stroke="#334155" stroke-width="2"/>

    <!-- Copper Heatpipes -->
    <path d="M84 114H154C168 114 178 104 186 90L210 50H246" stroke="url(#copperPipe)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M84 126H160C176 126 188 114 196 98L220 52" stroke="url(#copperPipe)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- CPU Die & Coldplate with fresh Thermal Paste -->
    <rect x="64" y="92" width="54" height="54" rx="8" fill="#475569" stroke="#94a3b8" stroke-width="1.8"/>
    <rect x="74" y="102" width="34" height="34" rx="5" fill="url(#copperPipe)"/>
    <!-- Thermal paste drop / Arctic silver -->
    <circle cx="91" cy="119" r="10" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1.5"/>
    <path d="M87 116C89 114 93 114 95 116" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <!-- Mounting screws -->
    <circle cx="70" cy="98" r="2.5" fill="#cbd5e1"/>
    <circle cx="112" cy="98" r="2.5" fill="#cbd5e1"/>
    <circle cx="70" cy="140" r="2.5" fill="#cbd5e1"/>
    <circle cx="112" cy="140" r="2.5" fill="#cbd5e1"/>

    <!-- Turbo Blower Cooling Fan Housing -->
    <circle cx="206" cy="122" r="54" fill="url(#fanShroud)" stroke="#94a3b8" stroke-width="2.5"/>
    <circle cx="206" cy="122" r="44" fill="#090d16" stroke="#334155" stroke-width="2"/>

    <!-- Turbine Fan Blades (12 curved blades) -->
    <g stroke="#cbd5e1" stroke-width="3" stroke-linecap="round" fill="none">
      <path d="M206 122C212 104 222 92 234 88"/>
      <path d="M206 122C222 112 236 108 246 112"/>
      <path d="M206 122C224 124 236 132 242 142"/>
      <path d="M206 122C216 138 220 150 218 162"/>
      <path d="M206 122C200 138 190 150 178 156"/>
      <path d="M206 122C190 132 176 136 166 132"/>
      <path d="M206 122C188 120 176 112 170 102"/>
      <path d="M206 122C196 106 192 94 194 82"/>
    </g>

    <!-- Fan Rotor Hub -->
    <circle cx="206" cy="122" r="16" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
    <circle cx="206" cy="122" r="6" fill="#38bdf8"/>

    <!-- Cool Airflow Waves & Sparkles -->
    <path d="M262 66C276 66 286 58 298 58" stroke="url(#airStream)" stroke-width="4" stroke-linecap="round"/>
    <path d="M268 82C282 82 292 74 306 74" stroke="url(#airStream)" stroke-width="4" stroke-linecap="round"/>
    <path d="M264 98C278 98 286 92 298 92" stroke="url(#airStream)" stroke-width="3" stroke-linecap="round"/>

    <!-- Temperature Badge (-15°C Cool Status) -->
    <rect x="56" y="156" width="84" height="28" rx="14" fill="#0284c7" stroke="#7dd3fc" stroke-width="1.5"/>
    <circle cx="72" cy="170" r="6" fill="#e0f2fe"/>
    <path d="M86 170H126" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <path d="M86 164H110" stroke="#bae6fd" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
