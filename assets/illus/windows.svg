<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <filter id="winShadow" x="6" y="8" width="84" height="80" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="winBlue" x1="16" y1="16" x2="72" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="ssdBadge" x1="52" y1="52" x2="84" y2="82" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10b981"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>
  <g filter="url(#winShadow)">
    <!-- App Window Container -->
    <rect x="12" y="14" width="64" height="60" rx="12" fill="#1e293b" stroke="#64748b" stroke-width="2"/>
    <!-- Modern Windows 11 4-Pane Grid -->
    <rect x="20" y="22" width="22" height="20" rx="3.5" fill="url(#winBlue)"/>
    <rect x="46" y="22" width="22" height="20" rx="3.5" fill="url(#winBlue)"/>
    <rect x="20" y="46" width="22" height="20" rx="3.5" fill="url(#winBlue)"/>
    <rect x="46" y="46" width="22" height="20" rx="3.5" fill="url(#winBlue)"/>

    <!-- Glossy Overlay on Panes -->
    <path d="M20 25.5C20 23.567 21.567 22 23.5 22H42V32L20 38V25.5Z" fill="#ffffff" fill-opacity="0.22"/>
    <path d="M46 22H64.5C66.433 22 68 23.567 68 25.5V32L46 38V22Z" fill="#ffffff" fill-opacity="0.16"/>

    <!-- Speed / Optimization Shield Badge -->
    <circle cx="68" cy="66" r="16" fill="url(#ssdBadge)" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M61 66L66 71L76 61" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
