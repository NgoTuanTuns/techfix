<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none">
  <title>Sửa chữa Điện thoại</title>
  <defs>
    <linearGradient id="ph-body" x1="50" y1="10" x2="110" y2="108" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b4c6b"/>
      <stop offset="1" stop-color="#162238"/>
    </linearGradient>
    <linearGradient id="ph-scr" x1="54" y1="14" x2="106" y2="104" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#23486e"/>
      <stop offset="0.5" stop-color="#17304d"/>
      <stop offset="1" stop-color="#0f2036"/>
    </linearGradient>
    <linearGradient id="ph-acc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0a35e"/>
      <stop offset="1" stop-color="#c2540f"/>
    </linearGradient>
    <linearGradient id="ph-bat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a9c1ab"/>
      <stop offset="1" stop-color="#52946b"/>
    </linearGradient>
    <filter id="ph-sh" x="28" y="4" width="108" height="114" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0a1224" flood-opacity="0.35"/>
    </filter>
  </defs>

  <ellipse cx="80" cy="108" rx="36" ry="5" fill="#0a1224" opacity="0.28"/>

  <g filter="url(#ph-sh)">
    <!-- Nút vật lý cạnh máy -->
    <rect x="46.5" y="30" width="2.5" height="9" rx="1" fill="#cbd5e1"/>
    <rect x="46.5" y="43" width="2.5" height="12" rx="1" fill="#cbd5e1"/>
    <rect x="111" y="38" width="2.5" height="15" rx="1" fill="#cbd5e1"/>

    <!-- Khung viền kim loại điện thoại -->
    <rect x="48" y="10" width="64" height="98" rx="13" fill="url(#ph-body)" stroke="#e2e8f0" stroke-width="1.6"/>
    <!-- Màn hình tràn viền -->
    <rect x="52" y="14" width="56" height="90" rx="10" fill="url(#ph-scr)"/>

    <!-- Ánh kính phản chiếu -->
    <path d="M54 16h28L54 78V16Z" fill="#ffffff" opacity="0.08"/>

    <!-- Dynamic Island / Loa thoại & Camera trước -->
    <rect x="70" y="17.5" width="20" height="5" rx="2.5" fill="#09111e"/>
    <circle cx="86.5" cy="20" r="1.4" fill="#3b82f6"/>

    <!-- Vòng kiểm tra pin & phần cứng trên màn hình -->
    <circle cx="80" cy="46" r="15" fill="#132740" stroke="#2d4c73" stroke-width="2"/>
    <circle cx="80" cy="46" r="15" stroke="url(#ph-bat)" stroke-width="3" stroke-dasharray="72 30" stroke-linecap="round" transform="rotate(-90 80 46)"/>
    <!-- Tia sét sạc nhanh ở tâm -->
    <path d="M81.5 37.5L75 46.5h5l-1.5 7 6.5-9h-5l1.5-7Z" fill="#fff4b8"/>

    <!-- Thẻ thông số màn hình & cảm ứng -->
    <rect x="58" y="67" width="44" height="12" rx="3.5" fill="#1e3859" stroke="#335580" stroke-width="0.9"/>
    <circle cx="64" cy="73" r="2.5" fill="#7ec89b"/>
    <path d="M70 71h20M70 75h13" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>

    <rect x="58" y="83" width="44" height="12" rx="3.5" fill="#1e3859" stroke="#335580" stroke-width="0.9"/>
    <circle cx="64" cy="89" r="2.5" fill="#f0a35e"/>
    <path d="M70 87h24M70 91h16" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round"/>

    <!-- Thanh Home Bar -->
    <rect x="71" y="99.5" width="18" height="2" rx="1" fill="#94a3b8"/>

    <!-- Huy hiệu bánh răng / bảo dưỡng góc phải dưới -->
    <circle cx="110" cy="86" r="14" fill="url(#ph-acc)" stroke="#fafaf3" stroke-width="2"/>
    <path d="M107.2 86.2l2.1 2.2 4.3-4.6" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="110" cy="86" r="8.5" stroke="#fff4b8" stroke-width="1.2" stroke-dasharray="2.5 3"/>
  </g>
</svg>
