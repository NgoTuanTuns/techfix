<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" fill="none">
  <defs>
    <filter id="ppShadow" x="20" y="8" width="200" height="148" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="phoneBottom" x1="68" y1="14" x2="172" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="usbcPlug" x1="96" y1="104" x2="144" y2="152" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#cbd5e1"/>
    </linearGradient>
  </defs>

  <g filter="url(#ppShadow)">
    <!-- Lower Half of Smartphone Frame -->
    <rect x="64" y="14" width="112" height="76" rx="16" fill="url(#phoneBottom)" stroke="#94a3b8" stroke-width="2.2"/>
    <rect x="72" y="14" width="96" height="54" rx="8" fill="#090d16"/>

    <!-- Fast Charging Indicator on Screen -->
    <circle cx="120" cy="40" r="16" fill="#10b981" fill-opacity="0.2" stroke="#10b981" stroke-width="2"/>
    <path d="M122 30L114 42H121L118 50L127 38H120L122 30Z" fill="#10b981"/>

    <!-- Bottom Speaker Grille Holes & USB-C Port Cutout -->
    <circle cx="84" cy="79" r="2.2" fill="#64748b"/>
    <circle cx="91" cy="79" r="2.2" fill="#64748b"/>
    <circle cx="98" cy="79" r="2.2" fill="#64748b"/>
    <!-- Clean Gold-Plated USB-C Port Socket -->
    <rect x="107" y="74" width="26" height="10" rx="5" fill="#090d16" stroke="#f59e0b" stroke-width="1.8"/>
    <rect x="112" y="78" width="16" height="2" rx="1" fill="#fbbf24"/>
    <circle cx="142" cy="79" r="2.2" fill="#64748b"/>
    <circle cx="149" cy="79" r="2.2" fill="#64748b"/>
    <circle cx="156" cy="79" r="2.2" fill="#64748b"/>

    <!-- USB-C Connector Plugging In -->
    <rect x="111" y="96" width="18" height="12" rx="2.5" fill="#e2e8f0" stroke="#64748b" stroke-width="1.5"/>
    <path d="M115 101H125" stroke="#f59e0b" stroke-width="2" stroke-linecap="round"/>
    <!-- Connector Housing with Orange LED -->
    <rect x="102" y="107" width="36" height="30" rx="7" fill="url(#usbcPlug)" stroke="#64748b" stroke-width="2"/>
    <rect x="114" y="116" width="12" height="4" rx="2" fill="#f97316"/>
    <!-- Braided Cable Tail -->
    <rect x="115" y="137" width="10" height="16" rx="2" fill="#475569"/>

    <!-- Connection Spark Waves -->
    <path d="M88 94L98 99" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M152 94L142 99" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
