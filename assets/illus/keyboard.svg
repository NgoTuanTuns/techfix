<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <filter id="kbShadow" x="4" y="12" width="88" height="74" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="kbPlate" x1="10" y1="22" x2="86" y2="76" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#334155"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="rgbGlow" x1="14" y1="68" x2="82" y2="68" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f97316"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
  </defs>
  <g filter="url(#kbShadow)">
    <!-- Aluminum Keyboard Deck -->
    <rect x="10" y="22" width="76" height="52" rx="9" fill="url(#kbPlate)" stroke="#64748b" stroke-width="2"/>
    <!-- RGB Backlight Underglow Bar -->
    <rect x="16" y="67" width="64" height="3" rx="1.5" fill="url(#rgbGlow)"/>

    <!-- Row 1 Keys -->
    <rect x="16" y="28" width="10" height="9" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="29" y="28" width="10" height="9" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <!-- Highlighted WASD / Esc Key -->
    <rect x="42" y="28" width="10" height="9" rx="2" fill="#f97316" stroke="#fed7aa" stroke-width="1"/>
    <rect x="55" y="28" width="10" height="9" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="68" y="28" width="12" height="9" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>

    <!-- Row 2 Keys -->
    <rect x="16" y="40" width="12" height="9" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <rect x="31" y="40" width="10" height="9" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="44" y="40" width="10" height="9" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="57" y="40" width="10" height="9" rx="2" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
    <rect x="70" y="40" width="10" height="9" rx="2" fill="#38bdf8" stroke="#bae6fd" stroke-width="1"/>

    <!-- Row 3 + Spacebar -->
    <rect x="16" y="52" width="12" height="10" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
    <rect x="31" y="52" width="34" height="10" rx="2.5" fill="#f8fafc" stroke="#94a3b8" stroke-width="1"/>
    <path d="M43 57H53" stroke="#64748b" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="68" y="52" width="12" height="10" rx="2" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  </g>
</svg>
