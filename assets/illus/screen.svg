<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" fill="none">
  <defs>
    <filter id="scrShadow" x="4" y="10" width="88" height="76" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
    <linearGradient id="ipsPanel" x1="14" y1="18" x2="82" y2="66" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0284c7"/>
      <stop offset="0.55" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <g filter="url(#scrShadow)">
    <!-- Display Bezel -->
    <rect x="12" y="16" width="72" height="50" rx="7" fill="#1e293b" stroke="#94a3b8" stroke-width="2"/>
    <!-- IPS Screen Panel -->
    <rect x="16" y="20" width="64" height="42" rx="4" fill="url(#ipsPanel)"/>
    <!-- Color Calibration Swatches (100% sRGB) -->
    <rect x="22" y="26" width="12" height="18" rx="2" fill="#f97316"/>
    <rect x="36" y="26" width="12" height="18" rx="2" fill="#10b981"/>
    <rect x="50" y="26" width="12" height="18" rx="2" fill="#38bdf8"/>
    <rect x="64" y="26" width="10" height="18" rx="2" fill="#f43f5e"/>
    <!-- Brightness / Resolution Bar -->
    <rect x="22" y="49" width="52" height="6" rx="3" fill="#0f172a" fill-opacity="0.5"/>
    <rect x="22" y="49" width="38" height="6" rx="3" fill="#f8fafc"/>
    <!-- Screen Gloss Reflection -->
    <path d="M56 20H74L54 62H36L56 20Z" fill="#ffffff" fill-opacity="0.14"/>
    <!-- Laptop Hinge & Base -->
    <rect x="36" y="66" width="24" height="4" rx="1" fill="#64748b"/>
    <path d="M8 70H88L83 77H13L8 70Z" fill="#cbd5e1" stroke="#64748b" stroke-width="1.5" stroke-linejoin="round"/>
  </g>
</svg>
