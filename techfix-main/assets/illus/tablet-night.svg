<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 560" preserveAspectRatio="xMidYMid slice">
  <title>Tablet dưới trăng, mạch điện mọc thành cành</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1424"/>
      <stop offset="1" stop-color="#0f1f1b"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#fff4b8" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff4b8" stop-opacity="0"/>
    </radialGradient>
    <path id="lf" d="M0 0C6-7 18-7 26 0 18 7 6 7 0 0Z"/>
  </defs>
  <rect width="480" height="560" fill="url(#bg)"/>
  <circle cx="360" cy="110" r="150" fill="url(#glow)"/>
  <circle cx="360" cy="110" r="52" fill="#fff4b8" opacity=".92"/>

  <!-- tablet -->
  <g transform="translate(220 320) rotate(-6)">
    <rect x="-120" y="-160" width="240" height="320" rx="26" fill="#1d2d4d" stroke="#3a5080" stroke-width="2"/>
    <rect x="-104" y="-144" width="208" height="288" rx="12" fill="#132038"/>
    <path d="M-70 80C-24 40 24 52 70 4" fill="none" stroke="#a9c1ab" stroke-width="4" stroke-linecap="round"/>
    <g fill="#a9c1ab">
      <use href="#lf" transform="translate(-40 62) rotate(-50)"/>
      <use href="#lf" transform="translate(0 50) rotate(20)"/>
      <use href="#lf" transform="translate(36 24) rotate(-60)"/>
    </g>
    <circle cx="0" cy="-56" r="34" fill="#fff4b8" opacity=".8"/>
    <!-- vết nứt góc kính -->
    <path d="M60 -130l-14 26 12 8-18 22" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- mạch → cành -->
  <g fill="none" stroke="#a9c1ab" stroke-opacity=".5" stroke-width="2" stroke-linejoin="round">
    <path d="M0 470h70l30-30h60"/>
    <path d="M480 300h-60l-24 24h-40"/>
  </g>
  <g fill="#fff4b8"><circle cx="70" cy="470" r="4"/><circle cx="420" cy="300" r="4"/></g>
  <path d="M356 324C330 360 300 380 280 420" fill="none" stroke="#6f8f7a" stroke-width="3" stroke-linecap="round"/>
  <g fill="#6f8f7a">
    <use href="#lf" transform="translate(340 344) rotate(130)"/>
    <use href="#lf" transform="translate(316 372) rotate(190)" fill="#a9b08a"/>
    <use href="#lf" transform="translate(296 400) rotate(120)"/>
  </g>

  <!-- đom đóm -->
  <g fill="#fff4b8">
    <circle cx="60" cy="140" r="9" opacity=".35"/><circle cx="60" cy="140" r="3"/>
    <circle cx="430" cy="470" r="9" opacity=".35"/><circle cx="430" cy="470" r="3"/>
  </g>
  <g fill="none" stroke="#3f5f4a" stroke-width="2.5" stroke-linecap="round">
    <path d="M30 560c4-30 10-50 22-64M42 560c-2-24-12-40-24-50"/>
    <path d="M420 560c4-30 10-50 22-64"/>
  </g>
</svg>
